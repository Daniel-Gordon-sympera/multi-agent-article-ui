# Sympera Scout — CI (offline validation, mirrors the pipeline repo's workflow).
#
# web    pnpm install → pnpm check (typecheck, lint, prettier, vitest) → pnpm build
# bff    uv sync → ruff check + format --check → lint-imports → pytest (Postgres 16)
# e2e    Playwright against `pnpm preview:mock` (no backend), report kept on failure
# image  the two-stage Docker build, never pushed
#
# Tool versions are pinned (Node 22, pnpm 10.28.0, uv 0.12.6, Python 3.12); actions
# are pinned to release tags.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.28.0
  NODE_VERSION: "22"
  UV_VERSION: 0.12.6
  PYTHON_VERSION: "3.12"

jobs:
  web:
    name: web (typecheck, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  bff:
    name: bff (ruff, import-linter, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scout_test
          POSTGRES_PASSWORD: scout_test
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout_test -d scout_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      UI_TEST_DATABASE_URL: postgresql+psycopg://scout_test:scout_test@localhost:5432/scout_test
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest -q

  e2e:
    name: e2e (Playwright, mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: image (docker build, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Dockerfile checks
        run: docker build --check .
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: false
          load: false
          tags: scout-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
