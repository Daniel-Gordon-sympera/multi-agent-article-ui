# Alembic history for the UI schema `ui`; the database URL comes from UI_DATABASE_URL
# (see bff/scout_bff/migrations/env.py). `python -m scout_bff.bootstrap` runs the
# same migrations programmatically and does not need this file.
[alembic]
script_location = bff/scout_bff/migrations
prepend_sys_path = bff
path_separator = os
